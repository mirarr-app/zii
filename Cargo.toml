[package]
name = "zii"
version = "0.2.1"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs", "signal"] }
notify = "8.0"
trash = "5.2"
toml = "0.8"
anyhow = "1.0"
tempfile = "3.17"
kamadak-exif = "0.6.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
