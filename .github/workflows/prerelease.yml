name: Pre-release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Pre-release tag (e.g. v0.1.0-beta.1)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-prerelease:
    name: Build & Publish Pre-release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Pre-release Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            BASE_VERSION="$(grep -m1 '^version' Cargo.toml | awk -F '"' '{print $2}')"
            TAG="v${BASE_VERSION}-pre.${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building pre-release for tag: ${TAG}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Test Suite
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Package Pre-release Assets
        id: package
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ARCHIVE_NAME="zii-${TAG}-x86_64-unknown-linux-gnu"
          
          mkdir -p "${ARCHIVE_NAME}"
          cp target/x86_64-unknown-linux-gnu/release/zii "${ARCHIVE_NAME}/"
          cp -r ui "${ARCHIVE_NAME}/"
          cp zii.desktop "${ARCHIVE_NAME}/"
          cp install.sh "${ARCHIVE_NAME}/"
          cp README.md "${ARCHIVE_NAME}/"
          
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          
          echo "archive=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE_NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Zii ${{ steps.tag.outputs.tag }} (Pre-release)
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
